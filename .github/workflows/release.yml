name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Generate Wails bindings
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html></html>' > frontend/dist/index.html
          wails generate module

      - name: Build frontend (for //go:embed)
        run: cd frontend && pnpm install --frozen-lockfile && pnpm run build

      - name: Test
        run: go test -v -race -cover ./cmd/... ./internal/...

      - name: Build cmd packages
        run: go build ./cmd/...

  test-vue:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Generate Wails bindings
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html></html>' > frontend/dist/index.html
          wails generate module

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Test
        run: cd frontend && pnpm run test

  release:
    name: Build Windows zip and publish
    needs: [test-go, test-vue]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails deps (Windows cross-compile)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config libglib2.0-dev mingw-w64

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend
        run: cd frontend && pnpm run build

      - name: Build Windows
        run: wails build -platform windows/amd64

      - name: Package Windows release zip
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go run ./cmd/package-windows --root . --exe build/bin/vrchat-tweaker.exe --out dist | tee dist/package-meta.txt
          VERSION="$(grep '^version=' dist/package-meta.txt | cut -d= -f2-)"
          ZIP_SHA="$(grep '^zip_sha256=' dist/package-meta.txt | cut -d= -f2-)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Validate release tag matches product version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${RELEASE_VERSION}"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "::error::Tag ${TAG} does not match productVersion ${EXPECTED} (package-meta version=${RELEASE_VERSION})"
            exit 1
          fi

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          BODY="$RUNNER_TEMP/body.md"
          NOTES_ERR="$RUNNER_TEMP/notes.err"
          {
            echo "Windows zip for **VRChat Tweaker** v${VERSION}."
            echo ""
            echo "**SHA256 (zip):** \`${ZIP_SHA256}\`"
            echo ""
            set +e
            NOTES="$(go run ./cmd/release-notes --version "$VERSION" --changelog CHANGELOG.md 2>"$NOTES_ERR")"
            NOTES_RC=$?
            set -e
            if [[ "$NOTES_RC" -eq 0 ]]; then
              printf '%s\n' "$NOTES"
            elif [[ "$NOTES_RC" -eq 2 ]]; then
              echo "_No CHANGELOG section for this version._"
            else
              cat "$NOTES_ERR" >&2
              exit "$NOTES_RC"
            fi
          } > "$BODY"
          echo "path=$BODY" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
