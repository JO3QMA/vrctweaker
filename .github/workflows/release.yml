name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Generate Wails bindings
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html></html>' > frontend/dist/index.html
          wails generate module

      - name: Build frontend (for //go:embed)
        run: cd frontend && pnpm install --frozen-lockfile && pnpm run build

      - name: Test
        run: go test -v -race -cover ./internal/...

  test-vue:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Generate Wails bindings
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html></html>' > frontend/dist/index.html
          wails generate module

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Test
        run: cd frontend && pnpm run test

  release:
    name: Build Windows zip and publish
    needs: [test-go, test-vue]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails deps (Windows cross-compile)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config libglib2.0-dev mingw-w64

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend
        run: cd frontend && pnpm run build

      - name: Build Windows
        run: GOMODCACHE=$HOME/gomodcache wails build -platform windows/amd64

      - name: Package Windows release zip
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          go run ./cmd/package-windows --root . --exe build/bin/vrchat-tweaker.exe --out dist | tee dist/package-meta.txt
          VERSION="$(grep '^version=' dist/package-meta.txt | cut -d= -f2-)"
          ZIP_SHA="$(grep '^zip_sha256=' dist/package-meta.txt | cut -d= -f2-)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.package.outputs.version }}"
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "Windows zip for **VRChat Tweaker** v${VERSION}."
            echo ""
            echo "**SHA256 (zip):** \`${{ steps.package.outputs.zip_sha256 }}\`"
            echo ""
            if go run ./cmd/release-notes --version "$VERSION" --changelog CHANGELOG.md; then
              true
            else
              echo "_No CHANGELOG section for this version._"
            fi
          } > "$BODY"
          echo "path=$BODY" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
