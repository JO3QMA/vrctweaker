name: Setup Wails CLI
description: Install Wails CLI at WAILS_CLI_VERSION in var/build-tool-versions.env (requires Go on PATH)

runs:
  using: composite
  steps:
    - name: Install Wails CLI
      shell: bash
      run: |
        set -euo pipefail
        envfile=var/build-tool-versions.env
        if [[ ! -f "$envfile" ]]; then
          echo "$envfile not found" >&2
          exit 1
        fi
        set -a
        # shellcheck disable=SC1091
        source "$envfile"
        set +a
        if [[ ! "${WAILS_CLI_VERSION:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "invalid WAILS_CLI_VERSION: ${WAILS_CLI_VERSION:-}" >&2
          exit 1
        fi
        go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}"
